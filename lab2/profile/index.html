<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <title>Profile</title>
    </head>
    <body>
        <header>
            <a href="#">
                <img src="img/menu_item_home.png" alt="Домашняя страница" height="40" width="40">
            </a>
            <a href="">
                <img src="img/menu_icon_is_profile.png" alt="Мой профиль" height="40" width="40">
            </a>
            <a href="#">
                <img src="img/menu_icon_add.png" alt="Добавить публицаию" height="40" width="40">
            </a>
        </header>
        <main>
            <div class="profile-info">
                <img src="img/avatar.png" alt="Аватар" height="123" width="123" class="avatar">
                <span class="nick-name">Ваня Денисов</span>
                <p>Привет! Я системный аналитик в ACME :) Тут моя жизнь только для самых классных!</p>
                <div class="count-posts">
                    <img src="img/image_icon.png" alt="Иконка фото" width="16" height="16">
                    <span>43 поста</span>
                </div>
            </div>
            <div class="photos">
                <img src="img/snowy_street.png" alt="Снежная улица" width="322.35" height="322.35">
                <img src="img/building.png" alt="Здание" width="322.35" height="322.35">
                <img src="img/cake.png" alt="Пирожоное" width="322.35" height="322.35">
                <img src="img/students.png" alt="Студенты" width="322.35" height="322.35">
                <img src="img/packet.png" alt="Пакет" width="322.35" height="322.35">
                <img src="img/book.png" alt="Книга" width="322.35" height="322.35">
                <img src="img/sunny_street.png" alt="Солнечная улица" width="322.35" height="29">
                <img src="img/selfie.png" alt="Селфи двух парней" width="322.35" height="29">
                <img src="img/pot.png" alt="Кастрюля" width="322.35" height="29">
            </div>
        </main>
    </body>
</html>
