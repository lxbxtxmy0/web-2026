<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <title>Login</title>
    </head>
    <body>
        <div class="login">
            <h1 class="login-text">Войти</h1>
            <img src="img/welcome.png" alt="welcome" height="501" width="462">
            <div class="login-block">
                <div class="field-block">
                    <div class="email-block">
                        <label for="email-field">Электропочта</label>
                        <input type="email" class="input-field" id="email-field">
                        <p class="email-format">Введите электропочту в формате *****@***.**</p>
                    </div>
                    <div class="password-block">
                        <label for="password-field">Пароль</label>
                        <input type="password" class="input-field" id="password-field">
                        <button class="hide-password">
                            <img src="img/eye_off.png" alt="Скрыть пароль" height="24" width="24">
                        </button>
                    </div>
                </div>
                <button href="#" class="continue-button">Продолжить</button>
            </div>
        </div>
    </body>
</html>
